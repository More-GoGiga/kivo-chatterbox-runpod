name: Publish Runpod image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - handler.py
      - rp_handler.py
      - .github/workflows/publish.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/more-gogiga/kivo-chatterbox-runpod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
